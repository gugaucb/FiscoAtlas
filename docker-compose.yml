services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: imposto
      POSTGRES_USER: imposto
      POSTGRES_PASSWORD: imposto
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  app:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/code
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://imposto:imposto@db:5432/imposto
volumes:
  pgdata:
