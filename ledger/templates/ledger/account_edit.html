{% extends "ledger/base.html" %}
{% block content %}
<h1>Editar conta</h1>
<div class="card">
  <form method="post">
    {% csrf_token %}
    {% for field in form %}
    <div class="form-row">
      <label for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
      {% if field.errors %}<span class="errors">{{ field.errors }}</span>{% endif %}
    </div>
    {% endfor %}
    <div class="btn-row">
      <button type="submit" class="btn">Salvar</button>
      <a href="{% url 'accounts' %}" class="btn secondary">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
