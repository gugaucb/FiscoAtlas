<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Imposto{% endblock %}</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center;
           justify-content: center; padding: 1.5rem;
           font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
           background: #f4f5f7; color: #1f2937; }
    .box { width: 100%; max-width: 26rem; }
    h1 { font-size: 1.35rem; margin: 0 0 .35rem; }
    .sub { color: #6b7280; font-size: .92rem; margin: 0 0 1.25rem; line-height: 1.5; }
    .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px;
            padding: 1.25rem; }
    .card + .card, .card + .btn { margin-top: 1rem; }
    label { display: block; font-size: .88rem; font-weight: 500; margin-bottom: .3rem; }
    input { width: 100%; padding: .6rem .7rem; font-size: 1rem;
            border: 1px solid #d1d5db; border-radius: 8px; }
    input:focus { outline: 2px solid #2563eb; outline-offset: 1px; border-color: #2563eb; }
    button, .btn { display: inline-block; width: 100%; padding: .65rem .9rem;
            font-size: 1rem; font-weight: 600; border: 0; border-radius: 8px;
            background: #2563eb; color: #fff; cursor: pointer; text-align: center;
            text-decoration: none; margin-top: 1rem; }
    button:hover, .btn:hover { background: #1d4ed8; }
    .alert { border-left: 4px solid #b45309; background: #fffbeb;
             padding: .8rem 1rem; border-radius: 8px; margin-bottom: 1rem; }
    .key { font-family: ui-monospace, monospace; font-size: 1.3rem;
           letter-spacing: .05em; text-align: center; margin: .75rem 0; }
    .hint { font-size: .85rem; color: #6b7280; }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <main class="box">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
